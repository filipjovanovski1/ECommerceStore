spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@ecommerce.local}
    from-name: ${MAIL_FROM_NAME:Ecommerce Store}
    reset-subject: ${MAIL_RESET_SUBJECT:Password Reset Request}